name: Release

# Triggered when a semver tag is pushed (e.g. `git tag v1.2.0 && git push --tags`).
# Builds one firmware per supported board, deploys the flasher site to GitHub
# Pages, and creates a GitHub Release with the binaries attached.
on:
  push:
    tags:
      - 'v*'

# Single concurrent release at a time — tag pushes are infrequent and we
# don't want a race between two tag pushes both deploying to Pages.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    name: Build firmware (${{ matrix.board.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          - id: thing_plus
            macro: BOARD_SPARKFUN_THING_PLUS_ESP32_S3
          - id: lonely_binary_n16r8
            macro: BOARD_LONELY_BINARY_N16R8_GOLD
    env:
      # Tells the firmware's CMake to use the bare version.txt string
      # (no "+sha6" dev suffix) — see CMakeLists.txt and MAINTENANCE.md.
      CC_RELEASE_BUILD: "1"
    steps:
      # Actions are pinned to commit SHAs (not tags) for supply-chain
      # security — see MAINTENANCE.md. Dependabot bumps these weekly.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          submodules: recursive

      - name: Verify tag matches version.txt
        run: |
          set -euo pipefail
          # version.txt holds bare semver (e.g. "0.3.0"); git tag has the
          # conventional 'v' prefix ("v0.3.0"). Strip a leading v from
          # both sides before comparing so either form works either side.
          TAG="${GITHUB_REF_NAME}"
          TAG_NORMALIZED="${TAG#v}"
          VERSION_TXT=$(tr -d '[:space:]' < version.txt)
          VERSION_NORMALIZED="${VERSION_TXT#v}"
          if [ "$TAG_NORMALIZED" != "$VERSION_NORMALIZED" ]; then
            echo "::error::Tag '$TAG' does not match version.txt ('$VERSION_TXT')."
            echo "::error::After stripping any leading 'v', '$TAG_NORMALIZED' != '$VERSION_NORMALIZED'."
            echo "::error::Bump version.txt to match the tag (or re-tag to match version.txt) before releasing."
            exit 1
          fi

      - name: Build firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5  # v1.2.0
        with:
          esp_idf_version: v6.0
          target: esp32s3
          path: '.'
          command: idf.py build -DBOARD_NAME=${{ matrix.board.macro }}

      - name: Stage binaries
        run: |
          set -euo pipefail
          mkdir -p out
          cp build/bootloader/bootloader.bin out/bootloader.bin
          cp build/partition_table/partition-table.bin out/partition-table.bin
          # The app .bin is the only top-level .bin in build/. Its name
          # tracks the project() in CMakeLists.txt; rename to firmware.bin
          # for a stable manifest reference.
          APP_BIN=$(ls build/*.bin | head -n 1)
          cp "$APP_BIN" out/firmware.bin

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firmware-${{ matrix.board.id }}
          path: out/

  publish:
    name: Publish site + release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the GitHub Release
      pages: write      # to deploy GitHub Pages
      id-token: write   # OIDC for the Pages deploy
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: Build Jekyll site (Cayman theme, matches plugin/bridge)
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: ./docs
          destination: ./_site

      - name: Inject firmware binaries + manifests into Jekyll output
        run: |
          set -euo pipefail
          for board_id in thing_plus lonely_binary_n16r8; do
            mkdir -p "_site/firmware/$board_id"
            cp artifacts/firmware-$board_id/*.bin "_site/firmware/$board_id/"
            python3 scripts/make_manifest.py \
              --board-id "$board_id" \
              --version "${GITHUB_REF_NAME}" \
              > "_site/firmware/$board_id/manifest.json"
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

      - id: deploy-pages
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: Stage release tarballs
        run: |
          set -euo pipefail
          mkdir -p release
          for board_id in thing_plus lonely_binary_n16r8; do
            tar -czf "release/${board_id}-${GITHUB_REF_NAME}.tar.gz" \
              -C "artifacts/firmware-$board_id" .
          done

      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: release/*.tar.gz
          generate_release_notes: true
